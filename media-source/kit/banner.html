<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(inter.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:500px;background:#090F1A;color:#EAF0F7;font-family:Inter,sans-serif;overflow:hidden;position:relative}
.brand{position:absolute;left:72px;top:60px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:34px;letter-spacing:-.03em}
.brand img{width:52px;height:52px;border-radius:10px}
h1{position:absolute;left:68px;top:168px;font-size:86px;line-height:.98;font-weight:700;letter-spacing:-.045em;white-space:nowrap}
.tags{position:absolute;left:72px;bottom:60px;display:flex;gap:10px;align-items:center}
.tags span{font-size:22px;font-weight:700;padding:6px 16px;border-radius:999px}
.tags b{font-size:24px;font-weight:500;margin-left:14px;color:#9AA7B8}
.uhd{background:#F2F6FA;color:#0A0E14}.bd{background:#3B9EFF;color:#04121F}.dvd{background:#C2A878;color:#1C1508}
.wall{position:absolute;left:820px;top:-70px;width:860px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.col{display:grid;gap:14px;align-content:start}
.wall img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;display:block}
.c2{margin-top:-110px}.c3{margin-top:-40px}.c4{margin-top:-150px}.c5{margin-top:-70px}
</style>
<body>
<div class="brand"><img src="mark.png"><span>DiscVault</span></div>
<h1>Your film shelf,<br>catalogued.</h1>
<div class="tags"><span class="uhd">4K UHD</span><span class="bd">Blu-ray</span><span class="dvd">DVD</span><b>iPhone · iPad · Self-hosted</b></div>
<div class="wall">
 <div class="col"><img src="p-24.png"><img src="p-01.png"><img src="p-35.png"></div>
 <div class="col c2"><img src="p-23.png"><img src="p-07.png"><img src="p-13.png"><img src="p-05.png"></div>
 <div class="col c3"><img src="p-37.png"><img src="p-43.png"><img src="p-40.png"></div>
 <div class="col c4"><img src="p-03.png"><img src="p-34.png"><img src="p-26.png"><img src="p-09.png"></div>
 <div class="col c5"><img src="p-31.png"><img src="p-19.png"><img src="p-27.png"></div>
</div>
</body>
