<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(inter.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#090F1A;color:#EAF0F7;font-family:Inter,sans-serif;overflow:hidden;position:relative}
.brand{position:absolute;left:64px;top:56px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:34px;letter-spacing:-.03em}
.brand img{width:52px;height:52px;border-radius:10px}
h1{position:absolute;left:60px;top:190px;font-size:80px;line-height:.98;font-weight:700;letter-spacing:-.045em;width:680px;white-space:nowrap}
p{position:absolute;left:64px;top:392px;font-size:30px;line-height:1.3;width:520px;color:#EAF0F7}
.tags{position:absolute;left:64px;bottom:56px;display:flex;gap:10px}
.tags span{font-size:22px;font-weight:700;padding:6px 16px;border-radius:999px}
.uhd{background:#F2F6FA;color:#0A0E14}.bd{background:#3B9EFF;color:#04121F}.dvd{background:#C2A878;color:#1C1508}
.wall{position:absolute;left:740px;top:-40px;width:560px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;transform:rotate(0deg)}
.wall img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;display:block}
.wall .c2{margin-top:-90px}.wall .c3{margin-top:-30px}
.col{display:grid;gap:14px;align-content:start}
</style>
<body>
<div class="brand"><img src="mark.png"><span>DiscVault</span></div>
<h1>Your film shelf,<br>catalogued.</h1>
<p>Scan a barcode. Keep every 4K, Blu-ray and DVD straight.</p>
<div class="tags"><span class="uhd">4K UHD</span><span class="bd">Blu-ray</span><span class="dvd">DVD</span></div>
<div class="wall">
 <div class="col"><img src="p-24.png"><img src="p-01.png"><img src="p-35.png"><img src="p-39.png"></div>
 <div class="col c2"><img src="p-23.png"><img src="p-07.png"><img src="p-13.png"><img src="p-05.png"></div>
 <div class="col c3"><img src="p-37.png"><img src="p-43.png"><img src="p-40.png"><img src="p-32.png"></div>
</div>
</body>
